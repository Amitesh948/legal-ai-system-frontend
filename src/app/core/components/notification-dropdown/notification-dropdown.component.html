<button mat-icon-button [matMenuTriggerFor]="notificationMenu" (menuOpened)="onMenuOpened()" class="notification-btn" aria-label="Notifications">
  <mat-icon [matBadge]="(unreadCount$ | async) || undefined" matBadgeColor="warn" [matBadgeHidden]="(unreadCount$ | async) === 0">
    notifications
  </mat-icon>
</button>

<mat-menu #notificationMenu="matMenu" class="notification-menu" xPosition="before" [overlapTrigger]="false">
  <div class="menu-header" (click)="$event.stopPropagation()">
    <h3>Notifications</h3>
    <button mat-button color="primary" class="mark-all-btn" (click)="markAllAsRead($event)" *ngIf="(unreadCount$ | async)! > 0">
      Mark all read
    </button>
  </div>
  
  <mat-divider></mat-divider>
  
  <div class="menu-content">
    <div class="loading-state" *ngIf="isLoading">
      <mat-spinner diameter="30"></mat-spinner>
    </div>
    
    <ng-container *ngIf="!isLoading">
      <div class="empty-state" *ngIf="(notifications$ | async)?.length === 0">
        <mat-icon class="empty-icon">notifications_none</mat-icon>
        <p>No notifications yet</p>
      </div>
      
      <div class="notification-list" *ngIf="(notifications$ | async)?.length! > 0">
        <div class="notification-item" 
             *ngFor="let notification of (notifications$ | async)" 
             [class.unread]="!notification.is_read"
             (click)="handleNotificationClick(notification)">
          
          <div class="notification-icon" [ngClass]="notification.type">
            <mat-icon>{{ getIconForType(notification.type) }}</mat-icon>
          </div>
          
          <div class="notification-details">
            <h4 class="notification-title">{{ notification.title }}</h4>
            <p class="notification-message">{{ notification.message }}</p>
            <span class="notification-time">{{ notification.created_at | date:'short' }}</span>
          </div>
          
          <div class="unread-dot" *ngIf="!notification.is_read"></div>
        </div>
      </div>
    </ng-container>
  </div>
</mat-menu>
