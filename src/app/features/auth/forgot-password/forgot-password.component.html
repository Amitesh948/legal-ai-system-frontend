<div class="auth-container animate-fade-in">
  <div class="auth-card-wrapper">
    <mat-card class="auth-card glass-panel">
      <div class="auth-header text-center">
        <div class="logo-box">
          <mat-icon>lock_reset</mat-icon>
        </div>
        <h2>Forgot Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
      </div>

      <mat-card-content>
        <div *ngIf="successMessage" class="alert alert-success">
          <mat-icon>check_circle</mat-icon>
          {{ successMessage }}
        </div>

        <div *ngIf="errorMessage" class="alert alert-error">
          <mat-icon>error</mat-icon>
          {{ errorMessage }}
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!successMessage" class="auth-form">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Email Address</mat-label>
            <mat-icon matPrefix>email</mat-icon>
            <input matInput type="email" formControlName="email" placeholder="Enter your email" required>
            <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="form.get('email')?.hasError('email')">Please enter a valid email address</mat-error>
          </mat-form-field>

          <button mat-flat-button color="primary" class="auth-button w-100 mt-3" type="submit" [disabled]="form.invalid || isLoading">
            <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
            <span *ngIf="!isLoading">Send Reset Link</span>
          </button>
        </form>
      </mat-card-content>

      <mat-card-footer class="auth-footer text-center">
        <p>Remembered your password? <a routerLink="/login" class="auth-link">Back to Login</a></p>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
