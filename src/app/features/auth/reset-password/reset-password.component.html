<div class="auth-container animate-fade-in">
  <div class="auth-card-wrapper">
    <mat-card class="auth-card glass-panel">
      <div class="auth-header text-center">
        <div class="logo-box">
          <mat-icon>vpn_key</mat-icon>
        </div>
        <h2>Set New Password</h2>
        <p>Please enter your new password below.</p>
      </div>

      <mat-card-content>
        <div *ngIf="successMessage" class="alert alert-success">
          <mat-icon>check_circle</mat-icon>
          {{ successMessage }}
        </div>

        <div *ngIf="errorMessage" class="alert alert-error">
          <mat-icon>error</mat-icon>
          {{ errorMessage }}
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!successMessage && token" class="auth-form">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>New Password</mat-label>
            <mat-icon matPrefix>lock</mat-icon>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="new_password" required>
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="form.get('new_password')?.hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="form.get('new_password')?.hasError('minlength')">Must be at least 8 characters</mat-error>
          </mat-form-field>

          <button mat-flat-button color="primary" class="auth-button w-100 mt-3" type="submit" [disabled]="form.invalid || isLoading">
            <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
            <span *ngIf="!isLoading">Reset Password</span>
          </button>
        </form>
      </mat-card-content>

      <mat-card-footer class="auth-footer text-center">
        <p><a routerLink="/login" class="auth-link">Back to Login</a></p>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
