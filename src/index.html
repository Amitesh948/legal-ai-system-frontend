<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon(2).ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      corePlugins: {
        preflight: false,
      },
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-container": "#00acc1",
            "secondary-container": "#3a4a5f",
            "surface-container-low": "#131b2e",
            "inverse-surface": "#dae2fd",
            "error-container": "#93000a",
            "on-secondary-fixed": "#0b1c30",
            "surface-bright": "#31394d",
            "error": "#ffb4ab",
            "outline-variant": "#3d494b",
            "on-tertiary-container": "#502b00",
            "on-tertiary-fixed-variant": "#6b3b00",
            "on-primary-container": "#003a42",
            "surface-container-highest": "#2d3449",
            "on-primary-fixed": "#001f24",
            "on-error": "#690005",
            "on-surface": "#dae2fd",
            "primary-fixed-dim": "#55d7ed",
            "on-tertiary": "#4b2800",
            "on-primary-fixed-variant": "#004e59",
            "surface-variant": "#2d3449",
            "tertiary-fixed": "#ffdcc0",
            "secondary": "#b7c8e1",
            "tertiary-fixed-dim": "#ffb875",
            "secondary-fixed": "#d3e4fe",
            "on-surface-variant": "#bcc9cc",
            "surface": "#0b1326",
            "inverse-on-surface": "#283044",
            "primary": "#55d7ed",
            "surface-container-lowest": "#060e20",
            "on-secondary-fixed-variant": "#38485d",
            "background": "#0b1326",
            "surface-container": "#171f33",
            "surface-dim": "#0b1326",
            "on-tertiary-fixed": "#2d1600",
            "on-secondary": "#213145",
            "secondary-fixed-dim": "#b7c8e1",
            "primary-fixed": "#9eefff",
            "inverse-primary": "#006876",
            "outline": "#869396",
            "on-secondary-container": "#a9bad3",
            "surface-tint": "#55d7ed",
            "on-background": "#dae2fd",
            "on-error-container": "#ffdad6",
            "surface-container-high": "#222a3d",
            "tertiary": "#ffb875",
            "tertiary-container": "#da8a36",

            "electric-teal": "#00acc1",
            "midnight-blue": "#0b1326",
            "midnight-blue-light": "#131b2e",
            "midnight-blue-lighter": "#31394d"

          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "margin-mobile": "16px",
            "sm": "8px",
            "xl": "40px",
            "lg": "24px",
            "xs": "4px",
            "md": "16px",
            "margin-desktop": "32px",
            "base": "4px",
            "gutter": "20px"
          },
          "fontFamily": {
            "code-mono": ["monospace"],
            "headline-lg-mobile": ["Inter"],
            "display-lg": ["Inter"],
            "headline-lg": ["Inter"],
            "label-sm": ["Inter"],
            "title-md": ["Inter"],
            "body-lg": ["Inter"],
            "body-md": ["Inter"]
          },
          "fontSize": {
            "code-mono": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
            "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
          }
        }
      }
    }

<body class="mat-typography antialiased min-h-screen flex flex-col overflow-x-hidden">
  <app-root></app-root>
</body>
</html>
